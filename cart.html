<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Keranjang - StyleHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

    <style>

        #cartContainer .cart-product-image {
            width: 70px !important;
            height: 80px !important;
            object-fit: contain !important;
            background: #f3f3f3;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .cart-product {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }

        .cart-product-info {
            flex: 1;
        }

        @media (max-width: 576px) {

            .cart-product {
                padding: 10px;
                gap: 10px;
            }

            #cartContainer .cart-product-image {
                width: 55px !important;
                height: 65px !important;
            }

        }

    </style>

</head>


<body>


<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold fs-3"
            href="index.html">

            STYLE<span>HUB</span>

        </a>

        <a
            href="products.html"
            class="btn btn-outline-dark">

            Belanja Lagi

        </a>

    </div>

</nav>


<section class="container py-5">

    <h1 class="fw-bold mb-4">

        Keranjang Saya

    </h1>


    <div id="cartContainer"></div>

</section>


<script src="cart.js"></script>

</body>

</html>
