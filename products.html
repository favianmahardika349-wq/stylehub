<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Produk - StyleHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="index.html">

            STYLE<span>HUB</span>

        </a>


        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#nav">

            ☰

        </button>


        <div class="collapse navbar-collapse"
             id="nav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       href="products.html">
                        Produk
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="cart.html">
                        🛒 Keranjang
                        <span id="cartCount"
                              class="badge bg-danger">
                            0
                        </span>
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<section class="container py-5">

    <h1 class="fw-bold">
        Koleksi Fashion
    </h1>

    <p class="text-secondary">
        Temukan pakaian yang sesuai dengan gayamu.
    </p>


    <div class="filter-box my-4">

        <div class="row g-3">

            <div class="col-lg-5">

                <label>
                    Cari Produk
                </label>

                <input
                    id="searchInput"
                    class="form-control"
                    placeholder="Cari baju..."
                    oninput="filterProducts()">

            </div>


            <div class="col-lg-3">

                <label>
                    Kategori
                </label>

                <select
                    id="categoryFilter"
                    class="form-select"
                    onchange="filterProducts()">

                    <option value="all">
                        Semua
                    </option>

                    <option value="T-Shirt">
                        T-Shirt
                    </option>

                    <option value="Hoodie">
                        Hoodie
                    </option>

                    <option value="Kemeja">
                        Kemeja
                    </option>

                    <option value="Celana">
                        Celana
                    </option>

                </select>

            </div>


            <div class="col-lg-4">

                <label>
                    Urutkan Harga
                </label>

                <select
                    id="sortFilter"
                    class="form-select"
                    onchange="filterProducts()">

                    <option value="default">
                        Terbaru
                    </option>

                    <option value="low">
                        Termurah
                    </option>

                    <option value="high">
                        Termahal
                    </option>

                </select>

            </div>

        </div>

    </div>


    <div id="productList"
         class="row g-4">
    </div>

</section>


<script src="products.js"></script>

<script>
    displayProducts();
    updateCartCount();
</script>

</body>
</html>
