<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - StyleHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="index.html">

            STYLE<span>HUB</span>

        </a>

    </div>

</nav>


<section class="container py-5">

    <h1 class="fw-bold mb-4">
        Checkout
    </h1>


    <div class="row g-4">


        <!-- ALAMAT -->

        <div class="col-lg-7">

            <div class="checkout-card">

                <h4 class="fw-bold mb-4">
                    Alamat Pengiriman
                </h4>


                <form id="checkoutForm" onsubmit="createOrder(event)">

                    <div class="mb-3">

                        <label class="form-label">
                            Nama Penerima
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Nomor HP
                        </label>

                        <input
                            type="tel"
                            id="customerPhone"
                            class="form-control"
                            placeholder="08xxxxxxxxxx"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Alamat Lengkap
                        </label>

                        <textarea
                            id="customerAddress"
                            class="form-control"
                            rows="4"
                            required></textarea>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Kurir
                        </label>

                        <select
                            id="shipping"
                            class="form-select"
                            required>

                            <option value="15000">
                                Reguler - Rp15.000
                            </option>

                            <option value="25000">
                                Express - Rp25.000
                            </option>

                        </select>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Pembayaran
                        </label>

                        <select
                            id="payment"
                            class="form-select"
                            required>

                            <option value="">
                                Pilih metode
                            </option>

                            <option value="Transfer Bank">
                                Transfer Bank
                            </option>

                            <option value="E-Wallet">
                                E-Wallet
                            </option>

                            <option value="COD">
                                COD
                            </option>

                        </select>

                    </div>


                    <button
    type="button"
    class="btn btn-dark w-100 py-3"
    onclick="createOrder(event)">

    Bayar & Buat Pesanan

                    </button>



                </form>

            </div>

        </div>


        <!-- RINGKASAN -->

        <div class="col-lg-5">

            <div class="summary-card">

                <h4 class="fw-bold">
                    Ringkasan Pesanan
                </h4>

                <hr>

                <div id="checkoutItems"></div>

                <hr>

                <div class="d-flex justify-content-between">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        Rp0
                    </strong>

                </div>

                <div class="d-flex justify-content-between mt-2">

                    <span>
                        Ongkir
                    </span>

                    <strong id="shippingPrice">
                        Rp15.000
                    </strong>

                </div>


                <hr>


                <div class="d-flex justify-content-between fs-5">

                    <strong>
                        Total
                    </strong>

                    <strong id="total">
                        Rp0
                    </strong>

                </div>

            </div>

        </div>

    </div>

</section>


<script src="/checkout .js"></script>
      
</body>
</html>
