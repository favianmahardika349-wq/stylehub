<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - StyleHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<!-- ======================================
     NAVBAR
====================================== -->

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold fs-3"
            href="index.html">

            STYLE<span>HUB</span>

        </a>


        <a
            href="cart.html"
            class="btn btn-outline-dark">

            🛒 Keranjang

        </a>

    </div>

</nav>



<!-- ======================================
     CHECKOUT
====================================== -->

<section class="container py-5">


    <h1 class="fw-bold mb-4">

        Checkout

    </h1>



    <div class="row g-4">


        <!-- ==================================
             DATA PENGIRIMAN
        =================================== -->

        <div class="col-lg-7">


            <div class="checkout-card">


                <h4 class="fw-bold mb-4">

                    Alamat Pengiriman

                </h4>



                <!-- NAMA -->

                <div class="mb-3">

                    <label
                        for="customerName"
                        class="form-label fw-semibold">

                        Nama Penerima

                    </label>


                    <input
                        type="text"
                        id="customerName"
                        class="form-control"
                        placeholder="Masukkan nama lengkap"
                        required>

                </div>



                <!-- NOMOR HP -->

                <div class="mb-3">

                    <label
                        for="customerPhone"
                        class="form-label fw-semibold">

                        Nomor HP

                    </label>


                    <input
                        type="tel"
                        id="customerPhone"
                        class="form-control"
                        placeholder="08xxxxxxxxxx"
                        required>

                </div>



                <!-- ALAMAT -->

                <div class="mb-3">

                    <label
                        for="customerAddress"
                        class="form-label fw-semibold">

                        Alamat Lengkap

                    </label>


                    <textarea
                        id="customerAddress"
                        class="form-control"
                        rows="4"
                        placeholder="Masukkan alamat lengkap..."
                        required></textarea>

                </div>



                <!-- KURIR -->

                <div class="mb-3">

                    <label
                        for="shipping"
                        class="form-label fw-semibold">

                        Kurir Pengiriman

                    </label>


                    <select
                        id="shipping"
                        class="form-select">

                        <option value="15000">

                            Reguler - Rp15.000

                        </option>


                        <option value="25000">

                            Express - Rp25.000

                        </option>

                    </select>

                </div>



                <!-- PEMBAYARAN -->

                <div class="mb-4">

                    <label
                        for="payment"
                        class="form-label fw-semibold">

                        Metode Pembayaran

                    </label>


                    <select
                        id="payment"
                        class="form-select">

                        <option value="">

                            Pilih metode pembayaran

                        </option>


                        <option value="Transfer Bank">

                            🏦 Transfer Bank

                        </option>


                        <option value="E-Wallet">

                            📱 E-Wallet

                        </option>


                        <option value="COD">

                            💵 COD

                        </option>

                    </select>

                </div>



                <!-- ==================================
                     TOMBOL BAYAR
                =================================== -->

                <button
                    type="button"
                    id="payButton"
                    onclick="createOrder()"
                    class="btn btn-dark btn-lg w-100">

                    💳 Bayar & Buat Pesanan

                </button>


            </div>

        </div>



        <!-- ==================================
             RINGKASAN PESANAN
        =================================== -->

        <div class="col-lg-5">


            <div class="summary-card">


                <h4 class="fw-bold">

                    Ringkasan Pesanan

                </h4>


                <hr>



                <!-- PRODUK -->

                <div id="checkoutItems">

                    <div class="text-center text-secondary py-3">

                        Memuat pesanan...

                    </div>

                </div>



                <hr>



                <!-- SUBTOTAL -->

                <div class="d-flex justify-content-between">

                    <span>

                        Subtotal

                    </span>


                    <strong id="subtotal">

                        Rp0

                    </strong>

                </div>



                <!-- ONGKIR -->

                <div
                    class="d-flex justify-content-between mt-2">

                    <span>

                        Ongkir

                    </span>


                    <strong id="shippingPrice">

                        Rp15.000

                    </strong>

                </div>



                <hr>



                <!-- TOTAL -->

                <div
                    class="d-flex justify-content-between fs-5">

                    <strong>

                        Total

                    </strong>


                    <strong id="total">

                        Rp0

                    </strong>

                </div>



            </div>

        </div>


    </div>

</section>



<!-- ======================================
     FOOTER
====================================== -->

<footer class="footer">

    <div class="container text-center">

        <h4 class="fw-bold">

            STYLE<span>HUB</span>

        </h4>


        <p class="mb-0">

            Fashion modern untuk gaya kamu.

        </p>

    </div>

</footer>



<!-- ======================================
     CHECKOUT JS
====================================== -->

<script src="checkout.js"></script>


</body>

</html>
