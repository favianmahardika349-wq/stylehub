<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - StyleHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar bg-white shadow-sm">
    <div class="container">
        <a href="index.html"
           class="navbar-brand fw-bold fs-3">
            STYLE<span>HUB</span>
        </a>

        <a href="cart.html"
           class="btn btn-outline-dark">
            Kembali ke Keranjang
        </a>
    </div>
</nav>


<section class="container py-5">

    <h1 class="fw-bold mb-4">
        Checkout
    </h1>

    <form id="checkoutForm">

        <div class="row g-4">

            <!-- DATA PEMBELI -->
            <div class="col-lg-7">

                <div class="checkout-card">

                    <h4 class="fw-bold mb-4">
                        Data Pengiriman
                    </h4>

                    <div class="mb-3">
                        <label class="form-label">
                            Nama Lengkap
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            class="form-control"
                            required>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Nomor HP
                        </label>

                        <input
                            type="tel"
                            id="customerPhone"
                            class="form-control"
                            required>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Alamat
                        </label>

                        <textarea
                            id="customerAddress"
                            class="form-control"
                            rows="4"
                            required></textarea>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Pengiriman
                        </label>

                        <select
                            id="shipping"
                            class="form-select">

                            <option value="15000">
                                Reguler - Rp15.000
                            </option>

                            <option value="25000">
                                Express - Rp25.000
                            </option>

                        </select>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Metode Pembayaran
                        </label>

                        <select
                            id="payment"
                            class="form-select"
                            required>

                            <option value="">
                                Pilih pembayaran
                            </option>

                            <option value="Transfer Bank">
                                Transfer Bank
                            </option>

                            <option value="COD">
                                COD
                            </option>

                            <option value="E-Wallet">
                                E-Wallet
                            </option>

                        </select>
                    </div>

                </div>

            </div>


            <!-- RINGKASAN -->
            <div class="col-lg-5">

                <div class="checkout-card">

                    <h4 class="fw-bold mb-4">
                        Ringkasan Pesanan
                    </h4>


                    <div id="checkoutItems"></div>


                    <hr>


                    <div class="d-flex justify-content-between">
                        <span>Subtotal</span>

                        <strong id="subtotal">
                            Rp0
                        </strong>
                    </div>


                    <div class="d-flex justify-content-between mt-2">
                        <span>Ongkir</span>

                        <strong id="shippingPrice">
                            Rp15.000
                        </strong>
                    </div>


                    <hr>


                    <div class="d-flex justify-content-between fs-5">

                        <strong>Total</strong>

                        <strong id="total">
                            Rp0
                        </strong>

                    </div>


                    <!-- INI YANG PENTING -->
                    <button
                        type="submit"
                        id="payButton"
                        class="btn btn-dark btn-lg w-100 mt-4">

                        💳 Bayar & Buat Pesanan

                    </button>

                </div>

            </div>

        </div>

    </form>

</section>


<!-- JS HARUS ADA -->
<script src="checkout.js"></script>

</body>
</html>
